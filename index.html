<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Fitaterana Madio — Signalement des faits de corruption · MTM / BCGIPI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>

    <!-- Formulaires lus par l'hébergeur (Netlify) au déploiement : ne pas supprimer -->
    <form name="doleance" data-netlify="true" netlify-honeypot="bot-field" hidden aria-hidden="true">
      <input name="bot-field" /><input name="code" /><input name="depose_le" /><input name="mode" /><input name="profil" /><input name="entite" /><input name="region" /><input name="lieu" /><input name="date_faits" /><input name="faits_continuent" /><input name="nature" /><input name="direction" /><textarea name="description"></textarea><input name="montant" /><input name="fonction_en_cause" /><input name="temoins" /><input name="deja_signale" /><input type="file" name="piece1" /><input type="file" name="piece2" /><input type="file" name="piece3" />
    </form>
    <form name="identite" data-netlify="true" netlify-honeypot="bot-field" hidden aria-hidden="true">
      <input name="bot-field" /><input name="code" /><input name="nom" /><input name="telephone" /><input name="courriel" />
    </form>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
